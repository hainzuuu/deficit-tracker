<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Deficit Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111927;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --c-empty: #1e293b;
      --c-cheat: #ef4444;
      --c-maintain: #f59e0b;
      --c-hit: #22c55e;
      --c-deep: #15803d;
      --cell-size: 16px;
      --cell-gap: 4px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 16px; }

    /* Auth Modal / Card */
    #auth-view { max-width: 400px; margin: 80px auto; width: 100%; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { background: #090d16; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .auth-form input:focus { border-color: #38bdf8; }
    .auth-buttons { display: flex; gap: 8px; margin-top: 4px; }
    .auth-buttons button { flex: 1; height: 42px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; }
    .btn-login { background: #2563eb; color: #fff; }
    .btn-signup { background: transparent; border: 1px solid var(--border) !important; color: var(--text); }
    .btn-signup:hover { background: #1e293b; }

    /* Main App (hidden until logged in) */
    #app-view { display: none; flex-direction: column; gap: 16px; width: 100%; }
    
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-info { font-size: 0.85rem; color: var(--text-muted); }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-logout:hover { color: var(--text); border-color: #475569; }

    .nav { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.1rem; }
    button.icon-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 1rem;
    }
    button.icon-btn:hover { background: #1e293b; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
    .logger-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    input, select {
      background: #090d16; border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 6px; font-size: 0.95rem; outline: none; height: 44px; width: 100%;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    button.primary {
      background: #16a34a; color: #fff; border: none;
      padding: 0 20px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 44px; width: 100%;
    }
    button.primary:hover { background: #22c55e; }

    .legend-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 14px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;
    }
    .legend-items { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 13px; height: 13px; border-radius: 3px; }

    .heatmap-wrapper {
      position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 8px; display: flex; scrollbar-width: thin; scrollbar-color: #334155 #0b1120;
    }
    .heatmap-wrapper::-webkit-scrollbar { height: 7px; }
    .heatmap-wrapper::-webkit-scrollbar-track { background: #0b1120; border-radius: 4px; }
    .heatmap-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .day-labels {
      position: sticky; left: 0; z-index: 10; background: var(--card-bg);
      display: grid; grid-template-rows: 24px repeat(7, var(--cell-size));
      gap: var(--cell-gap); font-size: 11px; color: var(--text-muted); padding-right: 10px;
    }
    .day-labels span { line-height: var(--cell-size); height: var(--cell-size); }

    .heatmap-grid {
      display: inline-grid; grid-template-rows: 24px repeat(7, var(--cell-size));
      grid-auto-flow: column; gap: var(--cell-gap);
    }
    .month-label { grid-row: 1; font-size: 12px; color: var(--text-muted); line-height: 20px; font-weight: 600; }
    .day-cell { width: var(--cell-size); height: var(--cell-size); border-radius: 3px; background: var(--c-empty); cursor: pointer; }
    .day-cell:hover { outline: 2px solid #38bdf8; }

    .stats { display: flex; gap: 20px; font-size: 0.9rem; }
    .stat span { font-weight: 700; color: #fff; }
    .status-msg { font-size: 0.8rem; color: #38bdf8; min-height: 18px; }

    @media (max-width: 600px) {
      body { padding: 12px 8px; }
      .card { padding: 14px 12px; }
      .logger-bar { grid-template-columns: 1fr; }
      .legend-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
      :root { --cell-size: 14px; --cell-gap: 3px; }
    }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-view" class="card">
  <h2 style="margin-bottom: 8px; font-size: 1.25rem;">Sign In</h2>
  <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">Access your private activity log</p>
  <form class="auth-form" onsubmit="handleAuth(event, 'login')">
    <input type="email" id="auth-email" placeholder="Email address" required />
    <input type="password" id="auth-password" placeholder="Password" required />
    <div class="auth-buttons">
      <button type="submit" class="btn-login">Log In</button>
      <button type="button" class="btn-signup" onclick="handleAuth(event, 'signup')">Sign Up</button>
    </div>
    <div id="auth-error" class="status-msg" style="color: #ef4444;"></div>
  </form>
</div>

<!-- MAIN APP SCREEN -->
<div id="app-view" class="container">
  <header>
    <h1>Activity Tracker</h1>
    <div class="header-right">
      <div class="nav">
        <button class="icon-btn" onclick="shiftYear(-1)">&lsaquo;</button>
        <span id="year-display"></span>
        <button class="icon-btn" onclick="shiftYear(1)">&rsaquo;</button>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <div class="card">
    <form class="logger-bar" onsubmit="saveLog(event)">
      <div class="field">
        <label>Date</label>
        <input type="date" id="date-input" required />
      </div>
      <div class="field">
        <label>Burn / Activity</label>
        <select id="burn-input">
          <option value="none" selected>No burn</option>
          <option value="little">Little</option>
          <option value="medium">Medium</option>
          <option value="heavy">Heavy</option>
        </select>
      </div>
      <div class="field">
        <label>Diet Intake</label>
        <select id="goal-input">
          <option value="deep">Deep deficit</option>
          <option value="hit" selected>Hit deficit</option>
          <option value="maintain">Maintenance</option>
          <option value="cheat">Cheating</option>
        </select>
      </div>
      <button type="submit" class="primary" id="save-btn">Log Day</button>
    </form>
    <div id="log-status" class="status-msg" style="margin-top: 8px;"></div>
  </div>

  <div class="card">
    <div class="legend-bar">
      <div class="legend-items">
        <span>Key:</span>
        <div class="legend-item"><div class="swatch" style="background: var(--c-empty);"></div> None</div>
        <div class="legend-item"><div class="swatch" style="background: var(--c-cheat);"></div> Cheating</div>
        <div class="legend-item"><div class="swatch" style="background: var(--c-maintain);"></div> Maintain</div>
        <div class="legend-item"><div class="swatch" style="background: var(--c-hit);"></div> Hit</div>
        <div class="legend-item"><div class="swatch" style="background: var(--c-deep);"></div> Deep Hit</div>
      </div>
      <div class="stats">
        <div class="stat">Deficit Hits: <span id="stat-hits">0</span></div>
        <div class="stat">Days Logged: <span id="stat-logged">0</span></div>
      </div>
    </div>

    <div class="heatmap-wrapper" id="heatmap-container">
      <div class="day-labels">
        <span></span>
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>
      <div class="heatmap-grid" id="grid"></div>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------
  // INSERT YOUR SUPABASE CREDENTIALS HERE
  // -------------------------------------------------------------
  const SUPABASE_URL = 'https://supabase.com/dashboard/project/fqbtbwtxdktebobptlha';
  const SUPABASE_KEY = 'sb_publishable_51iLajtO_eTyxI0LfRo9gg_qrcI3xE9';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let viewYear = new Date().getFullYear();
  let appData = {};

  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  document.getElementById('date-input').value = todayStr;

  // Session monitor: Auto-login if session exists in browser
  client.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'flex';
      fetchData();
    } else {
      currentUser = null;
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('app-view').style.display = 'none';
    }
  });

  async function handleAuth(e, type) {
    if (e) e.preventDefault();
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';

    if (!email || !password) {
      errEl.textContent = 'Please fill out both email and password.';
      return;
    }

    if (type === 'signup') {
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) {
        errEl.textContent = error.message;
      } else {
        errEl.style.color = '#22c55e';
        errEl.textContent = 'Account created. Logging in...';
      }
    } else {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) errEl.textContent = error.message;
    }
  }

  async function handleLogout() {
    await client.auth.signOut();
  }

  async function fetchData() {
    if (!currentUser) return;
    const { data, error } = await client
      .from('daily_logs')
      .select('date, burn, goal');

    if (error) {
      console.error(error);
      return;
    }

    appData = {};
    data.forEach(row => {
      appData[row.date] = { burn: row.burn, goal: row.goal };
    });
    renderGrid(true);
  }

  async function saveLog(e) {
    e.preventDefault();
    if (!currentUser) return;

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const date = document.getElementById('date-input').value;
    const burn = document.getElementById('burn-input').value;
    const goal = document.getElementById('goal-input').value;

    const { error } = await client
      .from('daily_logs')
      .upsert({ user_id: currentUser.id, date, burn, goal });

    btn.disabled = false;
    btn.textContent = 'Log Day';

    const statusEl = document.getElementById('log-status');
    if (error) {
      statusEl.textContent = 'Save error: ' + error.message;
    } else {
      statusEl.textContent = 'Saved.';
      setTimeout(() => { statusEl.textContent = ''; }, 2500);
      appData[date] = { burn, goal };
      renderGrid(true);
    }
  }

  function shiftYear(step) {
    viewYear += step;
    renderGrid(true);
  }

  function computeOutcome(entry) {
    if (!entry) return null;
    const goalScores = { cheat: 0, maintain: 1, hit: 2, deep: 3 };
    const burnScores = { none: 0, little: 0, medium: 1, heavy: 2 };
    const score = (goalScores[entry.goal] ?? 0) + (burnScores[entry.burn] ?? 0);

    if (score <= 0) return { score, label: 'Cheating', color: 'var(--c-cheat)' };
    if (score === 1) return { score, label: 'Maintain', color: 'var(--c-maintain)' };
    if (score === 2) return { score, label: 'Hit', color: 'var(--c-hit)' };
    return { score, label: 'Deep Hit', color: 'var(--c-deep)' };
  }

  function renderGrid(autoScroll = true) {
    document.getElementById('year-display').textContent = viewYear;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstDate = new Date(viewYear, 0, 1);
    const lastDate = new Date(viewYear, 11, 31);
    const startDayOfWeek = firstDate.getDay();

    let hits = 0;
    let logged = 0;
    let currentCol = 1;
    let targetScrollCell = null;

    for (let i = 0; i < startDayOfWeek; i++) {
      const pad = document.createElement('div');
      pad.className = 'day-cell';
      pad.style.gridRow = i + 2;
      pad.style.gridColumn = currentCol;
      pad.style.visibility = 'hidden';
      grid.appendChild(pad);
    }

    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let renderedMonths = new Set();

    let cursor = new Date(firstDate);
    while (cursor <= lastDate) {
      const dayOfWeek = cursor.getDay();
      const month = cursor.getMonth();
      const dayOfMonth = cursor.getDate();

      if (!renderedMonths.has(month) && (dayOfMonth <= 7 || cursor.getTime() === firstDate.getTime())) {
        const mLabel = document.createElement('div');
        mLabel.className = 'month-label';
        mLabel.textContent = monthNames[month];
        mLabel.style.gridRow = 1;
        mLabel.style.gridColumn = `${currentCol} / span 3`;
        grid.appendChild(mLabel);
        renderedMonths.add(month);
      }

      const y = cursor.getFullYear();
      const m = String(cursor.getMonth() + 1).padStart(2, '0');
      const d = String(cursor.getDate()).padStart(2, '0');
      const dateKey = `${y}-${m}-${d}`;
      const entry = appData[dateKey];
      const outcome = computeOutcome(entry);

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.style.gridRow = dayOfWeek + 2;
      cell.style.gridColumn = currentCol;
      cell.style.backgroundColor = outcome ? outcome.color : 'var(--c-empty)';

      if (dateKey === todayStr) {
        targetScrollCell = cell;
      }

      if (outcome) {
        logged++;
        if (outcome.score >= 2) hits++;
        cell.title = `${dateKey}\nDiet: ${entry.goal}\nBurn: ${entry.burn}\nStatus: ${outcome.label}`;
      } else {
        cell.title = `${dateKey}\nNo entry`;
      }

      cell.onclick = () => {
        document.getElementById('date-input').value = dateKey;
        if (entry) {
          document.getElementById('burn-input').value = entry.burn;
          document.getElementById('goal-input').value = entry.goal;
        }
      };

      grid.appendChild(cell);
      if (dayOfWeek === 6) currentCol++;
      cursor.setDate(cursor.getDate() + 1);
    }

    document.getElementById('stat-hits').textContent = hits;
    document.getElementById('stat-logged').textContent = logged;

    if (autoScroll) {
      requestAnimationFrame(() => {
        const container = document.getElementById('heatmap-container');
        if (targetScrollCell) {
          const scrollLeft = targetScrollCell.offsetLeft - container.clientWidth + 120;
          container.scrollLeft = Math.max(0, scrollLeft);
        } else if (viewYear < now.getFullYear()) {
          container.scrollLeft = container.scrollWidth;
        } else {
          container.scrollLeft = 0;
        }
      });
    }
  }
</script>
</body>
</html>
